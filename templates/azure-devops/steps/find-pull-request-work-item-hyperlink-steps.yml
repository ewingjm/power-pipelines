parameters:
  - name: pullRequestId
    displayName: Pull request ID
    type: string
    default: $(System.PullRequest.PullRequestId)
  - name: githubToken
    displayName: Optional GitHub token for PR metadata
    type: string
    default: ''
  - name: githubApiBaseUrl
    displayName: GitHub API base URL
    type: string
    default: https://api.github.com
  - name: workItemReferences
    displayName: Optional AB# work item references
    type: string
    default: ''
  - name: metadataQuery
    displayName: Metadata query
    type: object
  - name: variablePrefix
    displayName: Variable prefix
    type: string
    default: Relation
  - name: matrixVariableName
    displayName: Optional output variable name for a job matrix of all matching URLs (also outputs <name>Count and <name>Urls)
    type: string
    default: ''
  - name: additionalUrls
    displayName: Optional additional URLs (newline, comma or semicolon separated) to include in the matrix
    type: string
    default: ''
  - name: stepName
    displayName: Step name
    type: string
    default: FindWorkItemHyperlink
  - name: domainNamePrefix
    displayName: When set, only matrix URLs of environments named with this prefix and created by the service connection's application are output
    type: string
    default: ''
  - name: serviceConnection
    displayName: Service connection used to verify environment ownership (required with domainNamePrefix)
    type: string
    default: ''
  - name: stepDisplayName
    displayName: Step display name
    type: string
    default: Find work item hyperlink
  - name: condition
    displayName: Condition
    type: string
    default: succeeded()

steps:
  - ${{ if ne(parameters.domainNamePrefix, '') }}:
    - task: PowerPlatformToolInstaller@2
      displayName: Install Power Platform Build Tools
    - task: PowerPlatformSetConnectionVariables@2
      displayName: Set connection variables
      name: SetFindConnectionVariables
      inputs:
        authenticationType: PowerPlatformSPN
        PowerPlatformSPN: ${{ parameters.serviceConnection }}
    - template: /templates/power-platform/steps/get-service-principal-object-id-steps.yml
      parameters:
        tenantId: $(SetFindConnectionVariables.BuildTools.TenantId)
        applicationId: $(SetFindConnectionVariables.BuildTools.ApplicationId)
        clientSecret: $(SetFindConnectionVariables.BuildTools.ClientSecret)
        variableName: FindServicePrincipalObjectId
  - powershell: |
      function Test-ObjectSubset {
          param (
              $Object1,
              $Object2
          )

          if ($Object1 -isnot [System.Management.Automation.PSCustomObject] -or $Object2 -isnot [System.Management.Automation.PSCustomObject]) {
            return $Object1 -eq $Object2
          }

          $Object1Properties = $Object1 | Get-Member -MemberType Properties | Select-Object -ExpandProperty Name
          $Object2Properties = $Object2 | Get-Member -MemberType Properties | Select-Object -ExpandProperty Name

          foreach ($property in $Object1Properties) {
              if ($Object2Properties -notcontains $property) {
                  return $false
              }

              $Object1Value = $Object1 | Select-Object -ExpandProperty $property
              $Object2Value = $Object2 | Select-Object -ExpandProperty $property

              if (!(Test-ObjectSubset $Object1Value $Object2Value)) {
                  return $false
              }
          }

          return $true
      }

      function Set-VariablesFromObject {
          param(
              [Parameter(Mandatory)]
              [object]$Object,
                    
              [Parameter(Mandatory)]
              [string]$VariablePrefix
          )

          foreach ($property in $Object.psobject.properties) {
              $propertyName = $property.Name
              $propertyValue = $property.Value

              if ($propertyValue -is [PSCustomObject]) {
                  Set-VariablesFromObject -Object $propertyValue -VariablePrefix "$VariablePrefix.$propertyName"
              }
              elseif ($propertyValue -is [string] -and $propertyValue -match '^\{.*\}$') {
                  Set-VariablesFromObject -Object ($propertyValue | ConvertFrom-Json) -VariablePrefix "$VariablePrefix.$propertyName"
              } 
              else {
                  Write-Host "Setting $VariablePrefix.$propertyName variable to $propertyValue."
                  Write-Host "##vso[task.setvariable variable=$VariablePrefix.$propertyName;isOutput=true]$($propertyValue)"
              }
          }
      }

      function Get-ReferencedWorkItemIdsFromText {
          param(
            [string]$Text
          )

          if ([string]::IsNullOrWhiteSpace($Text)) {
            return @()
          }

          return [regex]::Matches($Text, '(?im)\bAB#(?<id>\d+)\b') |
          ForEach-Object { $_.Groups['id'].Value } |
          Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
          Sort-Object -Unique
        }

      function Resolve-PullRequestWorkItemIds {
          param(
            [string]$Provider,
            [string]$PullRequestId,
            [string]$WorkItemReferences
          )

          function Get-GitHubPullRequestText {
            param(
              [string]$ApiBaseUrl,
              [string]$RepositoryName,
              [string]$PullRequestNumber,
              [string]$GitHubToken
            )

              $effectiveGitHubToken = if (-not [string]::IsNullOrWhiteSpace($GitHubToken)) { $GitHubToken } else { $env:GITHUB_TOKEN }
              $effectiveApiBaseUrl = if (-not [string]::IsNullOrWhiteSpace($ApiBaseUrl)) { $ApiBaseUrl } elseif (-not [string]::IsNullOrWhiteSpace($env:GITHUB_API_BASE_URL)) { $env:GITHUB_API_BASE_URL } else { 'https://api.github.com' }

              if ([string]::IsNullOrWhiteSpace($effectiveGitHubToken)) {
              Write-Warning "GITHUB_TOKEN is not provided; unable to fetch GitHub PR title/body."
              return @()
            }

            if ([string]::IsNullOrWhiteSpace($RepositoryName) -or [string]::IsNullOrWhiteSpace($PullRequestNumber)) {
              Write-Warning "Repository name or pull request number is missing; unable to fetch GitHub PR title/body."
              return @()
            }

              $apiBase = $effectiveApiBaseUrl.TrimEnd('/')
            $uri = "$apiBase/repos/$RepositoryName/pulls/$PullRequestNumber"
            $headers = @{
                Authorization = "Bearer $effectiveGitHubToken"
              Accept        = "application/vnd.github+json"
              'User-Agent'  = 'azure-pipelines'
            }

            try {
              $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri $uri
              return @($pr.title, $pr.body)
            }
            catch {
              Write-Warning "Failed to fetch GitHub PR details from $uri. $($_.Exception.Message)"
              return @()
            }
          }

          if ($Provider -eq 'TfsGit') {
            $ids = az repos pr work-item list --id $PullRequestId --query [*].id | ConvertFrom-Json
            if ($null -eq $ids) {
              return @()
            }

            return @($ids | ForEach-Object { "$_" } | Sort-Object -Unique)
          }

          Write-Host "Using AB# reference parsing for repository provider '$Provider'."

          $githubPullRequestTexts = @()
          if ($Provider -eq 'GitHub') {
              $pullRequestNumber = if (-not [string]::IsNullOrWhiteSpace($env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER)) {
                  $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER
              }
              elseif (-not [string]::IsNullOrWhiteSpace($PullRequestId)) {
                  $PullRequestId
              }
              else {
                  ''
              }

              $githubPullRequestTexts = Get-GitHubPullRequestText -ApiBaseUrl $env:FINDWORKITEMHYPERLINK_GITHUBAPIBASEURL -RepositoryName $env:BUILD_REPOSITORY_NAME -PullRequestNumber $pullRequestNumber -GitHubToken $env:FINDWORKITEMHYPERLINK_GITHUBTOKEN
          }

          $sourceTexts = @(
            $WorkItemReferences,
            $env:SYSTEM_PULLREQUEST_TITLE,
            $env:SYSTEM_PULLREQUEST_PULLREQUESTTITLE,
            $githubPullRequestTexts,
            $env:SYSTEM_PULLREQUEST_SOURCEBRANCH,
            $env:SYSTEM_PULLREQUEST_TARGETBRANCH,
            $env:BUILD_SOURCEVERSIONMESSAGE
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $ids = @()
          foreach ($text in $sourceTexts) {
            $ids += Get-ReferencedWorkItemIdsFromText -Text $text
          }

          return @($ids | Sort-Object -Unique)
        }

      Write-Host "Finding pull request work item hyperlink."
      Write-Host "`tPull request ID: $env:FINDWORKITEMHYPERLINK_PULLREQUESTID"
      Write-Host "`tMetadata:`n$env:FINDWORKITEMHYPERLINK_METADATAQUERY"
                        
      az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project=$(System.TeamProject)

      Write-Host "Getting work items associated with pull request $env:FINDWORKITEMHYPERLINK_PULLREQUESTID."
      $workItemIds = Resolve-PullRequestWorkItemIds -Provider $env:BUILD_REPOSITORY_PROVIDER -PullRequestId $env:FINDWORKITEMHYPERLINK_PULLREQUESTID -WorkItemReferences $env:FINDWORKITEMHYPERLINK_WORKITEMREFERENCES

      function Get-NormalisedUrl {
          param(
              [string]$Url
          )

          return $Url.Trim().TrimEnd('/').ToLowerInvariant()
      }

      $metadataQuery = $env:FINDWORKITEMHYPERLINK_METADATAQUERY | ConvertFrom-Json
      $matchingRelations = @()

      foreach ($workItemId in $workItemIds) {
          Write-Host "Getting links for work item $workItemId."
          $workItem = az boards work-item show --id $workItemId --expand relations | ConvertFrom-Json
          $relations = @($workItem.relations | Where-Object rel -eq "Hyperlink")

          if ($relations.Count -eq 0) {
              Write-Host "No work item hyperlinks found for work item $workItemId."
              continue
          }

          foreach ($relation in $relations) {
              try {
                  $linkMetadata = $relation.attributes.comment | ConvertFrom-Json 
              } 
              catch { 
                  continue
              }

              if (!(Test-ObjectSubset $metadataQuery $linkMetadata)) {
                  continue;
              }

              Write-Host "Matching work item link found on work item $($workItemId): $($relation.url)."
              $matchingRelations += $relation
          }
      }

      # A link may exist on several work items, so de-duplicate by URL and keep the newest.
      $matchingRelations = @(
          $matchingRelations |
          Sort-Object -Property { $_.attributes.resourceCreatedDate } -Descending |
          Group-Object -Property { Get-NormalisedUrl $_.url } |
          ForEach-Object { $_.Group[0] } |
          Sort-Object -Property { $_.attributes.resourceCreatedDate } -Descending
      )

      if ($matchingRelations.Count -gt 0) {
          $newestRelation = $matchingRelations[0]
          Write-Host "Found $($matchingRelations.Count) matching work item link(s). Newest: $($newestRelation.url)."
          Write-Host "Expanding newest work item link to pipeline variables."
          Set-VariablesFromObject -Object $newestRelation -VariablePrefix $env:FINDWORKITEMHYPERLINK_VARIABLEPREFIX
      }
      else {
          Write-Host "Pull request work item link not found."
      }

      if (-not [string]::IsNullOrWhiteSpace($env:FINDWORKITEMHYPERLINK_MATRIXVARIABLENAME)) {
          $urls = [System.Collections.Generic.List[string]]::new()
          $seenUrls = [System.Collections.Generic.HashSet[string]]::new()

          # Link metadata is editable, so ownership is established from the platform: the environment must
          # match the expected name shape and have been created by this pipeline's service principal.
          $trustedInstanceHosts = $null
          if (-not [string]::IsNullOrWhiteSpace($env:FINDWORKITEMHYPERLINK_DOMAINNAMEPREFIX)) {
              if (-not (Get-Module Microsoft.PowerApps.Administration.PowerShell -ListAvailable)) {
                  Install-Module Microsoft.PowerApps.Administration.PowerShell -Scope CurrentUser -Force
              }

              Add-PowerAppsAccount -TenantID $env:FINDWORKITEMHYPERLINK_TENANTID -ApplicationId $env:FINDWORKITEMHYPERLINK_APPLICATIONID -ClientSecret $env:FINDWORKITEMHYPERLINK_CLIENTSECRET

              $createdBy = $env:FINDWORKITEMHYPERLINK_SERVICEPRINCIPALOBJECTID
              Write-Host "Only environments created by $createdBy will be trusted."

              $hostPattern = "^$([regex]::Escape($env:FINDWORKITEMHYPERLINK_DOMAINNAMEPREFIX.ToLowerInvariant()))-\d+-\d+\.crm\d*\.dynamics\.com$"
              $trustedInstanceHosts = @(
                  Get-AdminPowerAppEnvironment |
                  Where-Object { $_.Internal.properties.createdBy.id -eq $createdBy } |
                  ForEach-Object {
                      try { ([System.Uri]$_.Internal.properties.linkedEnvironmentMetadata.instanceUrl).Host.ToLowerInvariant() } catch { }
                  } |
                  Where-Object { $_ -and $_ -match $hostPattern } |
                  Where-Object {
                      # The host suffix is -<BuildId>-<JobAttempt>: if the build is still retained it must have run for this pull request.
                      # Expired builds are tolerated; the createdBy check remains the authority.
                      $buildId = ($_ -split '\.')[0] -replace "^.*-(\d+)-\d+$", '$1'
                      $build = az pipelines runs show --id $buildId 2>$null | ConvertFrom-Json
                      if (-not $build) {
                          Write-Warning "Build $buildId for $_ is no longer available; relying on the creator check."
                          return $true
                      }
                      if ($build.sourceBranch -ne "refs/pull/$($env:FINDWORKITEMHYPERLINK_PULLREQUESTID)/merge") {
                          Write-Warning "Ignoring $_ as build $buildId did not run for pull request $($env:FINDWORKITEMHYPERLINK_PULLREQUESTID)."
                          return $false
                      }
                      return $true
                  }
              )
          }

          $additionalUrls = "$env:FINDWORKITEMHYPERLINK_ADDITIONALURLS" -split '[\r\n,;]+' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and $_ -notmatch '^\$\(.*\)$' }

          foreach ($url in @($additionalUrls) + @($matchingRelations | ForEach-Object { $_.url })) {
              if ([string]::IsNullOrWhiteSpace($url)) {
                  continue
              }

              if ($trustedInstanceHosts -ne $null) {
                  try { $urlHost = ([System.Uri]$url.Trim()).Host.ToLowerInvariant() } catch { $urlHost = '' }
                  if ($trustedInstanceHosts -notcontains $urlHost) {
                      Write-Warning "Ignoring $url as it is not a validation environment created by this service connection."
                      continue
                  }
              }

              if ($seenUrls.Add((Get-NormalisedUrl $url))) {
                  $urls.Add($url.Trim())
              }
          }

          $matrix = [ordered]@{}
          for ($i = 0; $i -lt $urls.Count; $i++) {
              $matrix["Environment$($i + 1)"] = @{ EnvironmentUrl = $urls[$i] }
          }

          $matrixJson = if ($urls.Count -gt 0) { $matrix | ConvertTo-Json -Compress } else { '{"NoEnvironments":{"EnvironmentUrl":""}}' }
          Write-Host "Found $($urls.Count) URL(s):"
          $urls | ForEach-Object { Write-Host "`t$_" }
          Write-Host "##vso[task.setvariable variable=$env:FINDWORKITEMHYPERLINK_MATRIXVARIABLENAME;isOutput=true]$matrixJson"
          Write-Host "##vso[task.setvariable variable=$($env:FINDWORKITEMHYPERLINK_MATRIXVARIABLENAME)Count;isOutput=true]$($urls.Count)"
          Write-Host "##vso[task.setvariable variable=$($env:FINDWORKITEMHYPERLINK_MATRIXVARIABLENAME)Urls;isOutput=true]$($urls -join ', ')"
      }
    name: ${{ parameters.stepName }}
    displayName: ${{ parameters.stepDisplayName }}
    condition: ${{ parameters.condition }}
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      FINDWORKITEMHYPERLINK_PULLREQUESTID: ${{ parameters.pullRequestId }}
      FINDWORKITEMHYPERLINK_GITHUBTOKEN: ${{ parameters.githubToken }}
      FINDWORKITEMHYPERLINK_GITHUBAPIBASEURL: ${{ parameters.githubApiBaseUrl }}
      FINDWORKITEMHYPERLINK_WORKITEMREFERENCES: ${{ parameters.workItemReferences }}
      FINDWORKITEMHYPERLINK_METADATAQUERY: ${{ convertToJson(parameters.metadataQuery) }}
      FINDWORKITEMHYPERLINK_VARIABLEPREFIX: ${{ parameters.variablePrefix }}
      FINDWORKITEMHYPERLINK_MATRIXVARIABLENAME: ${{ parameters.matrixVariableName }}
      FINDWORKITEMHYPERLINK_ADDITIONALURLS: ${{ parameters.additionalUrls }}
      ${{ if ne(parameters.domainNamePrefix, '') }}:
        FINDWORKITEMHYPERLINK_DOMAINNAMEPREFIX: ${{ parameters.domainNamePrefix }}
        FINDWORKITEMHYPERLINK_TENANTID: $(SetFindConnectionVariables.BuildTools.TenantId)
        FINDWORKITEMHYPERLINK_APPLICATIONID: $(SetFindConnectionVariables.BuildTools.ApplicationId)
        FINDWORKITEMHYPERLINK_CLIENTSECRET: $(SetFindConnectionVariables.BuildTools.ClientSecret)
        FINDWORKITEMHYPERLINK_SERVICEPRINCIPALOBJECTID: $(FindServicePrincipalObjectId)
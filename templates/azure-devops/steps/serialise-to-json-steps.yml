parameters:
  - name: object
    displayName: Object
    type: object
  - name: variable
    displayName: Variable
    type: string
  - name: stepDisplayName
    displayName: Step display name
    type: string
    default: Serialise pipeline object to JSON
  - name: condition
    displayName: Condition
    type: string
    default: succeeded()
  - name: maxLength
    displayName: Optional maximum JSON length
    type: number
    default: 0

steps:
  - powershell: |
      Write-Host "Setting $env:SERIALISETOJSON_VARIABLE to the following JSON:"
      Write-Host $env:SERIALISETOJSON_OBJECT
      
      $compressedJson = $env:SERIALISETOJSON_OBJECT | ConvertFrom-Json | ConvertTo-Json -Depth 100 -Compress 

      if ($env:SERIALISETOJSON_MAXLENGTH -and [int]$env:SERIALISETOJSON_MAXLENGTH -gt 0) {
        $maxLength = [int]$env:SERIALISETOJSON_MAXLENGTH
        $jsonLength = $compressedJson.Length

        if ($jsonLength -gt $maxLength) {
          Write-Error "Serialized JSON length ($jsonLength) exceeds the configured maximum ($maxLength). Reduce metadata fields or values before setting the variable '$env:SERIALISETOJSON_VARIABLE'."
          exit 1
        }
      }

      Write-Host "##vso[task.setvariable variable=$env:SERIALISETOJSON_VARIABLE;]$compressedJson"
    displayName: ${{ parameters.stepDisplayName }}
    condition: ${{ parameters.condition }}
    env:
      SERIALISETOJSON_OBJECT: ${{ convertToJson(parameters.object) }}
      SERIALISETOJSON_VARIABLE: ${{ parameters.variable }}
      SERIALISETOJSON_MAXLENGTH: ${{ parameters.maxLength }}
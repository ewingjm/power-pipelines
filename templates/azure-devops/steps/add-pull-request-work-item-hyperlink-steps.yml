parameters:
  - name: pullRequestId
    displayName: Pull Request ID
    type: string
  - name: githubToken
    displayName: Optional GitHub token for PR metadata
    type: string
    default: ''
  - name: githubApiBaseUrl
    displayName: GitHub API base URL
    type: string
    default: https://api.github.com
  - name: workItemReferences
    displayName: Optional AB# work item references
    type: string
    default: ''
  - name: url
    displayName: External URL
    type: string
  - name: comment
    displayName: Comment
    type: string
  - name: historyComment
    displayName: History comment
    type: string
    default: ''
  - name: stepDisplayName
    displayName: Step display name
    type: string
    default: Add pull request work item hyperlink(s)
  - name: condition
    displayName: Condition
    type: string
    default: succeeded()

steps:
  - powershell: |
      function Get-ReferencedWorkItemIdsFromText {
          param(
              [string]$Text
          )

          if ([string]::IsNullOrWhiteSpace($Text)) {
              return @()
          }

          return [regex]::Matches($Text, '(?im)\bAB#(?<id>\d+)\b') |
            ForEach-Object { $_.Groups['id'].Value } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Sort-Object -Unique
      }

      function Resolve-PullRequestWorkItemIds {
          param(
              [string]$Provider,
              [string]$PullRequestId,
              [string]$WorkItemReferences
          )

          function Get-GitHubPullRequestText {
              param(
                  [string]$ApiBaseUrl,
                  [string]$RepositoryName,
                  [string]$PullRequestNumber,
                  [string]$GitHubToken
              )

              $effectiveGitHubToken = if (-not [string]::IsNullOrWhiteSpace($GitHubToken)) { $GitHubToken } else { $env:GITHUB_TOKEN }
              $effectiveApiBaseUrl = if (-not [string]::IsNullOrWhiteSpace($ApiBaseUrl)) { $ApiBaseUrl } elseif (-not [string]::IsNullOrWhiteSpace($env:GITHUB_API_BASE_URL)) { $env:GITHUB_API_BASE_URL } else { 'https://api.github.com' }

              if ([string]::IsNullOrWhiteSpace($effectiveGitHubToken)) {
                  Write-Warning "GITHUB_TOKEN is not provided; unable to fetch GitHub PR title/body."
                  return @()
              }

              if ([string]::IsNullOrWhiteSpace($RepositoryName) -or [string]::IsNullOrWhiteSpace($PullRequestNumber)) {
                  Write-Warning "Repository name or pull request number is missing; unable to fetch GitHub PR title/body."
                  return @()
              }

              $apiBase = $effectiveApiBaseUrl.TrimEnd('/')
              $uri = "$apiBase/repos/$RepositoryName/pulls/$PullRequestNumber"
              $headers = @{
                  Authorization = "Bearer $effectiveGitHubToken"
                  Accept        = "application/vnd.github+json"
                  'User-Agent'  = 'azure-pipelines'
              }

              try {
                  $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri $uri
                  return @($pr.title, $pr.body)
              }
              catch {
                  Write-Warning "Failed to fetch GitHub PR details from $uri. $($_.Exception.Message)"
                  return @()
              }
          }

          if ($Provider -eq 'TfsGit') {
              $ids = az repos pr work-item list --id $PullRequestId --query [*].id | ConvertFrom-Json
              if ($null -eq $ids) {
                  return @()
              }

              return @($ids | ForEach-Object { "$_" } | Sort-Object -Unique)
          }

          Write-Host "Using AB# reference parsing for repository provider '$Provider'."

          $githubPullRequestTexts = @()
          if ($Provider -eq 'GitHub') {
              $pullRequestNumber = if (-not [string]::IsNullOrWhiteSpace($env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER)) {
                  $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER
              }
              elseif (-not [string]::IsNullOrWhiteSpace($PullRequestId)) {
                  $PullRequestId
              }
              else {
                  ''
              }

              $githubPullRequestTexts = Get-GitHubPullRequestText -ApiBaseUrl $env:ADDHYPERLINK_GITHUBAPIBASEURL -RepositoryName $env:BUILD_REPOSITORY_NAME -PullRequestNumber $pullRequestNumber -GitHubToken $env:ADDHYPERLINK_GITHUBTOKEN
          }

          $sourceTexts = @(
              $WorkItemReferences,
              $env:SYSTEM_PULLREQUEST_TITLE,
              $env:SYSTEM_PULLREQUEST_PULLREQUESTTITLE,
              $githubPullRequestTexts,
              $env:SYSTEM_PULLREQUEST_SOURCEBRANCH,
              $env:SYSTEM_PULLREQUEST_TARGETBRANCH,
              $env:BUILD_SOURCEVERSIONMESSAGE
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $ids = @()
          foreach ($text in $sourceTexts) {
              $ids += Get-ReferencedWorkItemIdsFromText -Text $text
          }

          return @($ids | Sort-Object -Unique)
      }

      Write-Host "Adding pull request work item hyperlink(s)."
      Write-Host "`tPull request ID: $env:ADDHYPERLINK_PULLREQUESTID"
      Write-Host "`tURL: $env:ADDHYPERLINK_URL"
      Write-Host "`tComment: $env:ADDHYPERLINK_COMMENT"

      az devops configure --defaults organization=$(System.TeamFoundationCollectionUri) project=$(System.TeamProject)

      $workItems = Resolve-PullRequestWorkItemIds -Provider $env:BUILD_REPOSITORY_PROVIDER -PullRequestId $env:ADDHYPERLINK_PULLREQUESTID -WorkItemReferences $env:ADDHYPERLINK_WORKITEMREFERENCES

      if ($workItems.Count -eq 0) {
          Write-Host "No work items found."
          return
      }

      $apiBaseUrl = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/"
      $endpointUrl = "$($apiBaseUrl)_apis/wit/workitems"
      $requestHeaders = @{
          "Authorization" = "Bearer $env:AZURE_DEVOPS_EXT_PAT"
          "Content-Type"  = "application/json-patch+json"
      }

      $requests = $workItems | ForEach-Object {
          $patchDocument = [System.Collections.ArrayList]@(
              @{
                  op    = "add"
                  path  = "/relations/-"
                  value = @{
                      url = $env:ADDHYPERLINK_URL
                      rel = "Hyperlink"
                      attributes = @{
                          comment = $env:ADDHYPERLINK_COMMENT
                          isLocked = $true
                      }
                  }
              }
          )

          if ($env:ADDHYPERLINK_HISTORYCOMMENT) {
              $patchDocument.Add(@{
                  op    = "add"
                  path  = "/fields/System.History"
                  value = $env:ADDHYPERLINK_HISTORYCOMMENT
              }) | Out-Null
          }

          $request = ConvertTo-Json -Depth 4 -InputObject $patchDocument -Compress
          $response = Invoke-WebRequest -Method Patch -Headers $requestHeaders -Uri "$endpointUrl/$($_)?api-version=7.0" -Body $request -UseBasicParsing

          if ($response.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
              Write-Error $response.StatusDescription
              return
          }
      }

      Write-Host "Work item link added successfully."
    displayName: ${{ parameters.stepDisplayName }}
    condition: ${{ parameters.condition }}
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      ADDHYPERLINK_PULLREQUESTID: ${{ parameters.pullRequestId }}
      ADDHYPERLINK_GITHUBTOKEN: ${{ parameters.githubToken }}
      ADDHYPERLINK_GITHUBAPIBASEURL: ${{ parameters.githubApiBaseUrl }}
      ADDHYPERLINK_WORKITEMREFERENCES: ${{ parameters.workItemReferences }}
      ADDHYPERLINK_URL: ${{ parameters.url }}
      ADDHYPERLINK_COMMENT: ${{ parameters.comment }}
      ADDHYPERLINK_HISTORYCOMMENT: ${{ parameters.historyComment }}
parameters:
  - name: ref
    displayName: Ref
    type: string
  - name: filePatterns
    displayName: File patterns
    type: object
  - name: targetRef
    displayName: Target branch commit the environment was built from
    type: string
    default: ''
  - name: stepName
    displayName: Step name
    type: string
    default: GetIsUpdated
  - name: stepDisplayName
    displayName: Step display name
    type: string
    default: Get is updated
  - name: repository
    displayName: Repository
    type: string
    default: $(Build.SourcesDirectory)

steps:
  - powershell: |
      $repositoryRoot = git rev-parse --show-toplevel
      
      if ($env:GETISUPDATED_REF -match '^[0-9a-f]{7}$' -and $env:GETISUPDATED_TARGETREF -match '^[0-9a-f]{7}$') {
        # Existing environment: it was built from a source commit merged with a target commit.
        # Updates are anything changed on the source branch OR the target branch since then.
        $sourceNow = if ($env:SYSTEM_PULLREQUEST_SOURCECOMMITID) { $env:SYSTEM_PULLREQUEST_SOURCECOMMITID } else { 'HEAD' }
        $currentParents = @((git rev-list --parents -n 1 HEAD) -split ' ')
        $targetNow = if ($currentParents.Count -eq 3) { $currentParents[1] } else { "origin/$env:SYSTEM_PULLREQUEST_TARGETBRANCHNAME" }
      
        Write-Host "Comparing source $env:GETISUPDATED_REF with $sourceNow and target $env:GETISUPDATED_TARGETREF with $targetNow."
        $sourceFiles = git diff --name-only $env:GETISUPDATED_REF $sourceNow
        $sourceExit = $LASTEXITCODE
        $targetFiles = git diff --name-only $env:GETISUPDATED_TARGETREF $targetNow
        $targetExit = $LASTEXITCODE
      
        if ($sourceExit -ne 0 -or $targetExit -ne 0) {
          Write-Warning "Unable to compare with the environment's commits. Treating all files as updated."
          $updatedFiles = git ls-tree -r --name-only HEAD | ForEach-Object { "$repositoryRoot/$_" }
        }
        else {
          $updatedFiles = @($sourceFiles) + @($targetFiles) | Sort-Object -Unique | ForEach-Object { "$repositoryRoot/$_" }
        }
      }
      elseif ($env:GETISUPDATED_REF -match '^[0-9a-f]{7}$') {
        Write-Host "Comparing HEAD with $env:GETISUPDATED_REF."
        $updatedFiles = git diff --name-only "HEAD..$env:GETISUPDATED_REF" | ForEach-Object { "$repositoryRoot/$_" }
      }
      else {
        Write-Host "Comparing HEAD with origin/$env:GETISUPDATED_REF."
        $updatedFiles = git diff --name-only "HEAD..origin/$env:GETISUPDATED_REF" | ForEach-Object { "$repositoryRoot/$_" }
      }

      Write-Host "The following files have been updated:`n"
      $updatedFiles | ForEach-Object { Write-Host " - $_" }
      
      $patterns = ($env:GETISUPDATED_PATTERNS -split "," -replace "\\", "/") | ForEach-Object { "$repositoryRoot/$_" }
      Write-Host "`nChecking for changes matching the following:`n"
      $patterns | ForEach-Object { Write-Host " - $_" }
      
      $updated = $false
      foreach ($updatedFile in $updatedFiles) {
        foreach ($pattern in $patterns) {
            if ($updatedFile -like $pattern) {
              $updated = $true
              break
            }
        }

        if ($updated) {
          break
        }
      }
            
      Write-Host "`nFiles updated: $updated."
      Write-Host "##vso[task.setvariable variable=IsUpdated;isOutput=true]$updated"
    displayName: ${{ parameters.stepDisplayName }}
    name: ${{ parameters.stepName }}
    workingDirectory: ${{ parameters.repository }}
    env:
      GETISUPDATED_REF: ${{ parameters.ref }}
      GETISUPDATED_TARGETREF: ${{ parameters.targetRef }}
      GETISUPDATED_PATTERNS: ${{ join(',', parameters.filePatterns) }}  
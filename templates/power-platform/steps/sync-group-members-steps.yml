parameters:
  - name: environmentId
    displayName: Environment ID
    type: string
  - name: groupObjectId
    displayName: Group object ID
    type: string
  - name: username
    displayName: Username (DEPRECATED)
    type: string
  - name: password
    displayName: Password (DEPRECATED)
    type: string
  - name: tenantID
    displayName: Tenant ID
    type: string
  - name: applicationId
    displayName: Application ID
    type: string
  - name: clientSecret
    displayName: Client secret
    type: string

steps:
  - powershell: |
      if (!(Get-Module -ListAvailable -Name Microsoft.Graph.Authentication)) { 
        Install-Module -Name Microsoft.Graph.Authentication -Force -Scope CurrentUser
      }

      if (!(Get-Module -ListAvailable -Name Microsoft.Graph.Groups)) { 
        Install-Module -Name Microsoft.Graph.Groups -Force -Scope CurrentUser
      }
      
      if (!(Get-Module -ListAvailable -Name Microsoft.PowerApps.Administration.PowerShell)) { 
        Install-Module -Name Microsoft.PowerApps.Administration.PowerShell -Force -Scope CurrentUser -MaximumVersion 2.0.194
      }

      Write-Host "Forcing sync of Microsoft Entra ID users."

      Write-Host "Authenticating as $env:SYNCUSERS_APPLICATIONID."
      Add-PowerAppsAccount -TenantID $env:SYNCUSERS_TENANTID -ApplicationId $env:SYNCUSERS_APPLICATIONID -ClientSecret $env:SYNCUSERS_CLIENTSECRET

      $clientSecretCredential = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList $env:SYNCUSERS_APPLICATIONID, (ConvertTo-SecureString -String $env:SYNCUSERS_CLIENTSECRET -AsPlainText -Force)

      Write-Host "Connecting to Microsoft Graph as $env:SYNCUSERS_APPLICATIONID."
      Connect-MgGraph -TenantId $env:SYNCUSERS_TENANTID -ClientSecretCredential $clientSecretCredential | Out-Null

      $groupMembers = Get-MgGroupMember -GroupId $env:SYNCUSERS_GROUP -All -Property "id","displayName"
      Write-Host "Found $($groupMembers.Count) members to sync in Microsoft Entra ID group."

      $groupMembers | ForEach-Object {
          Write-Host "Syncing $($_.AdditionalProperties['displayName'])."                  
          Add-AdminPowerAppsSyncUser -EnvironmentName $env:SYNCUSERS_ENVIRONMENTID -PrincipalObjectId $_.Id | Out-Null
      }
    displayName: Sync users
    env:
      SYNCUSERS_TENANTID: ${{ parameters.tenantId }}
      SYNCUSERS_APPLICATIONID: ${{ parameters.applicationId }}
      SYNCUSERS_CLIENTSECRET: ${{ parameters.clientSecret }}
      SYNCUSERS_ENVIRONMENTID: ${{ parameters.environmentId }}
      SYNCUSERS_GROUP: ${{ parameters.groupObjectId }}
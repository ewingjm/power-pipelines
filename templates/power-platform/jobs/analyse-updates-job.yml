parameters:
  - name: ref
    displayName: Ref
    type: string
  - name: targetRef
    displayName: Target branch commit the environment was built from
    type: string
    default: ''
  - name: solutionSourcePattern
    displayName: Solution source pattern
    type: string
  - name: webResourceSourcePatterns
    displayName: Web resource source patterns
    type: object
    default: []
  - name: assemblySourcePatterns
    displayName: Assembly source patterns
    type: object
    default: []
  - name: additionalPatterns
    displayName: Additional patterns  
    type: object
    default: []
  - name: repository
    displayName: Repository
    type: string
    default: $(Build.SourcesDirectory)
  - name: jobName
    displayName: Job name
    type: string
    default: AnalyseUpdates
  - name: jobDisplayName
    displayName: Job display name
    type: string
    default: Analyse updates
  - name: dependsOn
    displayName: Depends on
    type: object
    default: []
  - name: condition
    displayName: Condition
    type: string
    default: succeeded()

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobDisplayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      AnalyseUpdates.Ref: ${{ parameters.ref }}
      AnalyseUpdates.TargetRef: ${{ parameters.targetRef }}
      AnalyseUpdates.Repo: ${{ parameters.repository }}
    steps:
      - checkout: self
        fetchDepth: 0
      - template: ../steps/analyse-git-solution-updates-steps.yml
        parameters:
          ref: $(AnalyseUpdates.Ref)
          targetRef: $(AnalyseUpdates.TargetRef)
          solutionSourcePattern: ${{ parameters.solutionSourcePattern }}
          webResourceSourcePatterns: ${{ parameters.webResourceSourcePatterns }}
          assemblySourcePatterns: ${{ parameters.assemblySourcePatterns }}
          repository: $(AnalyseUpdates.Repo)
      - ${{ each pattern in parameters.additionalPatterns }}:
        - template: ../steps/analyse-git-updates-steps.yml
          parameters:
            ref: $(AnalyseUpdates.Ref)
            targetRef: $(AnalyseUpdates.TargetRef)
            filePatterns: ${{ pattern.filePatterns }}
            stepName: ${{ pattern.stepName }}
            stepDisplayName: ${{ pattern.stepDisplayName }}
            repository: ${{ parameters.repository }}
      - powershell: |
          function Test-Triggered($prefix) {
            $triggered = $false
            Get-ChildItem env: | Where-Object { $_.Name -like "$($prefix)_*" } | ForEach-Object {
              Write-Host "$($_.Name): $($_.Value)"
              if ($_.Value -eq 'True') { $triggered = $true }
            }

            return $triggered
          }

          $creationTriggered = Test-Triggered 'ENVCREATE'
          $updateTriggered = Test-Triggered 'ENVUPDATE'

          Write-Host "`nEnvironment creation triggered by additional patterns: $creationTriggered."
          Write-Host "Environment update triggered by additional patterns: $updateTriggered."
          Write-Host "##vso[task.setvariable variable=CreationTriggered;isOutput=true]$creationTriggered"
          Write-Host "##vso[task.setvariable variable=UpdateTriggered;isOutput=true]$updateTriggered"
        displayName: Get environment triggers from additional patterns
        name: GetAdditionalEnvironmentTriggers
        env:
          ENVCREATE_NONE: 'False'
          ENVUPDATE_NONE: 'False'
          ${{ each pattern in parameters.additionalPatterns }}:
            ${{ if eq(pattern.triggerenvironmentCreate, true) }}:
              ENVCREATE_${{ upper(pattern.stepName) }}: $(${{ pattern.stepName }}.IsUpdated)
            ${{ if eq(pattern.triggerEnvironmentUpdate, true) }}:
              ENVUPDATE_${{ upper(pattern.stepName) }}: $(${{ pattern.stepName }}.IsUpdated)
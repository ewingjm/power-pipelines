parameters:
  - name: serviceConnection
    displayName: Service connection
    type: string
    default: ''
  - name: environment
    displayName: Environment
    type: string
    default: ''
  - name: environments
    displayName: Environments
    type: object
    default: []
  - name: packages
    displayName: Packages
    type: object
  - name: url
    displayName: URL (optional override)
    type: string
    default: ''
  - name: tagSuccess
    displayName: Tag resources on successful deployment
    type: boolean
    default: false
  - name: postDeploymentJobs
    displayName: Optional post-deployment jobs
    type: jobList
    default: []
  - name: testJobs
    displayName: Optional test jobs
    type: jobList
    default: []

stages:
  - template: ../stages/set-aggregate-run-number-stage.yml
    parameters:
      resources:
        - ${{ each package in parameters.packages }}:
          - ${{ package.resource }}
  - ${{ if eq(length(parameters.environments), 0) }}:
    - template: ../stages/deploy-and-test-packages-stages.yml
      parameters:
        serviceConnection: ${{ parameters.serviceConnection }}
        environment: ${{ parameters.environment }}
        packages: ${{ parameters.packages }}
        url: ${{ parameters.url }}
        tagSuccess: ${{ parameters.tagSuccess }}
        postDeploymentJobs: ${{ parameters.postDeploymentJobs }}
        testJobs: ${{ parameters.testJobs }}
  - ${{ each target in parameters.environments }}:
    - template: ../stages/deploy-and-test-packages-stages.yml
      parameters:
        serviceConnection: ${{ coalesce(target.serviceConnection, parameters.serviceConnection) }}
        environment: ${{ target.environment }}
        packages: ${{ parameters.packages }}
        url: ${{ coalesce(target.url, parameters.url) }}
        tagSuccess: ${{ parameters.tagSuccess }}
        postDeploymentJobs: ${{ parameters.postDeploymentJobs }}
        testJobs: ${{ parameters.testJobs }}
        ${{ if target.variables }}:
          variables: ${{ target.variables }}
        deployStageName: ${{ format('DeployPackages_{0}', replace(replace(replace(target.environment, ' ', '_'), '-', '_'), '.', '_')) }}
        testStageName: ${{ format('Test_{0}', replace(replace(replace(target.environment, ' ', '_'), '-', '_'), '.', '_')) }}
        testStageDisplayName: ${{ format('Test {0}', target.environment) }}
        dependsOn:
          - SetAggregateRunNumber
          - ${{ if target.dependsOn }}:
            - ${{ each dependency in target.dependsOn }}:
              - ${{ if gt(length(parameters.testJobs), 0) }}:
                - ${{ format('Test_{0}', replace(replace(replace(dependency, ' ', '_'), '-', '_'), '.', '_')) }}
              - ${{ if eq(length(parameters.testJobs), 0) }}:
                - ${{ format('DeployPackages_{0}', replace(replace(replace(dependency, ' ', '_'), '-', '_'), '.', '_')) }}

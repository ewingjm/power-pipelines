parameters:
  - name: serviceConnection
    displayName: The service connection
    type: string
  - name: categoryStates
    displayName: Category states
    type: object
  - name: metadata
    displayName: Metadata
    type: object
    default: {}
  - name: createdBy
    displayName: (Obsolete - ignored) The pipeline now only deletes environments created by the service connection's own service principal
    type: string
    default: ''

stages:
  - stage: DeleteEnvironments
    displayName: Delete environments
    jobs:
      - job: DeleteEnvironments
        displayName: Delete environments
        variables:
          DeleteEnvironments.CategoryStates: ${{ convertToJson(parameters.categoryStates) }}
          DeleteEnvironments.Metadata: ${{ convertToJson(parameters.metadata) }}
        steps:
          - checkout: none
          - task: PowerPlatformToolInstaller@2
            displayName: Install Power Platform Build Tools
          - task: PowerPlatformSetConnectionVariables@2
            displayName: Set connection variables
            name: SetConnectionVariables
            inputs:
              authenticationType: PowerPlatformSPN
              PowerPlatformSPN: ${{ parameters.serviceConnection }}
          - template: /templates/power-platform/steps/get-service-principal-object-id-steps.yml
            parameters:
              tenantId: $(SetConnectionVariables.BuildTools.TenantId)
              applicationId: $(SetConnectionVariables.BuildTools.ApplicationId)
              clientSecret: $(SetConnectionVariables.BuildTools.ClientSecret)
              variableName: DeleteServicePrincipalObjectId
          - powershell: |
              function Test-ObjectSubset {
                param (
                    $Object1,
                    $Object2
                )

                if ($Object1 -isnot [System.Management.Automation.PSCustomObject] -or $Object2 -isnot [System.Management.Automation.PSCustomObject]) {
                  return $Object1 -eq $Object2
                }

                $Object1Properties = $Object1 | Get-Member -MemberType Properties | Select-Object -ExpandProperty Name
                $Object2Properties = $Object2 | Get-Member -MemberType Properties | Select-Object -ExpandProperty Name

                foreach ($property in $Object1Properties) {
                    if ($Object2Properties -notcontains $property) {
                        return $false
                    }

                    $Object1Value = $Object1 | Select-Object -ExpandProperty $property
                    $Object2Value = $Object2 | Select-Object -ExpandProperty $property

                    if (!(Test-ObjectSubset $Object1Value $Object2Value)) {
                        return $false
                    }
                }

                return $true
              }

              $getProjectParameters = @{
                  Method          = "GET"
                  Headers         = @{
                      "Authorization" = "Bearer $env:AZURE_DEVOPS_EXT_PAT"
                      "Content-Type"  = "application/json"
                  }
                  Uri             = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)_apis/projects/$env:SYSTEM_TEAMPROJECTID/properties?keys=System.ProcessTemplateType&api-version=7.1-preview.1"
                  UseBasicParsing = $true
              }

              $getProjectResponse = Invoke-WebRequest @getProjectParameters
              if ($getProjectResponse.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
                  Write-Error $getProjectResponse.StatusDescription
                  return
              }

              $projectProperties = ConvertFrom-Json -InputObject $getProjectResponse.Content
              $processTypeId = $projectProperties.value[0].value

              $getWorkItemTypesParameters = @{
                  Method          = "GET"
                  Headers         = $getProjectParameters.Headers
                  Uri             = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)_apis/work/processes/$processTypeId/workitemtypes?`$expand=States&api-version=7.0"
                  UseBasicParsing = $true
              }

              $getWorkItemTypesResponse = Invoke-WebRequest @getWorkItemTypesParameters
              if ($getWorkItemTypesResponse.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
                  Write-Error $getWorkItemTypesResponse.StatusDescription
                  return
              }

              $workItemTypes = ConvertFrom-Json -InputObject $getWorkItemTypesResponse.Content
              $categoryStates = $env:DELETEENVIRONMENTS_CATEGORYSTATES | ConvertFrom-Json
              $states = $workItemTypes.value.states | `
                  Where-Object stateCategory -in $categoryStates | `
                  Select-Object -ExpandProperty name -Unique

              $hostPattern = '-\d+-\d+\.crm\d*\.dynamics\.com$'
              $apiBase = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$($env:SYSTEM_TEAMPROJECT)/"
              $stateConditions = ($states | ForEach-Object { return "[System.State] = '$($_)'" }) -join " OR "
              $workItemQuery = @"
              SELECT [System.Id] 
              FROM WorkItems 
              WHERE [System.TeamProject] = '$env:SYSTEM_TEAMPROJECT'
              AND [System.HyperlinkCount] > 0 
              AND ($stateConditions)
              "@
                          
              Write-Host "Getting work items with the following query:"
              Write-Host $workItemQuery

              $wiqlParameters = @{
                  Method          = "POST"
                  Headers         = @{
                      "Authorization" = "Bearer $env:AZURE_DEVOPS_EXT_PAT"
                      "Content-Type"  = "application/json"
                  }
                  Uri             = "$($apiBase)_apis/wit/wiql?api-version=7.0"
                  Body            = @{ query = $workItemQuery } | ConvertTo-Json -Compress
                  UseBasicParsing = $true
              }

              $response = Invoke-WebRequest @wiqlParameters
              if ($response.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
                  Write-Error $response.StatusDescription
                  return
              }

              $content = ConvertFrom-Json -InputObject $response.Content
              if (-not($content.workItems.length -gt 0)) {
                  Write-Host "No work items found."
                  return
              }

              Write-Host "Found $($content.workItems.length) matching work items."

              $environmentsToDelete = [System.Collections.ArrayList]@()
              $counter = @{ Value = 0 }
              $workItemBatches = $content.workItems | Group-Object -Property { [math]::Floor($counter.Value++ / 200) }
              for ($batch = 0; $batch -lt $workItemBatches.Values.Count; $batch++) {
                  $currentBatch = $workItemBatches[$batch]
                  Write-Host "Retrieving work item links for batch $($batch + 1) ($($currentBatch.Group.Count) work items)."
                  $ids = [string]::Join(",", $currentBatch.Group.id)
                  $listWorkItemsParameters = @{
                      Method          = "GET"
                      Headers         = $wiqlParameters.Headers
                      Uri             = "$($apiBase)_apis/wit/workitems?ids=$ids&`$expand=relations&api-version=7.0"
                      UseBasicParsing = $true
                  }

                  $listWorkItemsResponse = Invoke-WebRequest @listWorkItemsParameters
                  if ($listWorkItemsResponse.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
                      Write-Error $listWorkItemsResponse.StatusDescription
                      return
                  }

                  $workItems = ConvertFrom-Json -InputObject $listWorkItemsResponse.Content
                  $metadataQuery = $env:DELETEENVIRONMENTS_METADATA | ConvertFrom-Json
                  if ($metadataQuery -isnot [System.Management.Automation.PSCustomObject]) {
                      $metadataQuery = [PSCustomObject]@{}
                  }

                  # Scope to hyperlinks created from this pipeline's repository unless the caller set repoId explicitly.
                  # The build identity and work items can be shared across teams, so this stops one team's run from
                  # treating another team's hyperlinks (to environments its service principal cannot see) as stale.
                  if (-not ($metadataQuery.PSObject.Properties.Name -contains 'repoId')) {
                      if (-not $env:BUILD_REPOSITORY_ID) {
                          Write-Error "Build.Repository.ID is not available, so hyperlinks cannot be scoped to this repository. Set metadata.repoId explicitly."
                          return
                      }
                      $metadataQuery | Add-Member -NotePropertyName repoId -NotePropertyValue $env:BUILD_REPOSITORY_ID
                  }
                  Write-Host "Metadata filter: $($metadataQuery | ConvertTo-Json -Compress)"

                  $workItems.value | ForEach-Object {
                      $workItem = $_
                      $workItemId = $workItem.id
                      [array]$hyperlinksWithComments = $_.relations | Where-Object { $_.rel -eq "Hyperlink" -and $_.attributes.comment -ne $null }
                      
                      if ($hyperlinksWithComments.Count -gt 0) {
                          Write-Host "Analyzing $($hyperlinksWithComments.Count) hyperlink(s) for work item $workItemId..."
                      }
                      
                      $matchedCount = 0
                      $hyperlinksWithComments | ForEach-Object {
                          $relation = $_
                          if (!$relation.attributes.comment) {
                              Write-Host "  ✗ No comment metadata: $($relation.url)"
                              return
                          }

                          try {
                              $metadata = $relation.attributes.comment | ConvertFrom-Json 
                          }
                          catch [System.ArgumentException] {
                              Write-Host "  ✗ Invalid metadata: $($relation.url)"
                              return
                          }

                          if (-not(Test-ObjectSubset -Object1 $metadataQuery -Object2 $metadata)) {
                              Write-Host "  ✗ Metadata mismatch: $($relation.url)"
                              return
                          }

                          try {
                              $relationHost = ([System.Uri]$relation.url).Host
                          }
                          catch {
                              Write-Host "  ✗ Invalid URL: $($relation.url)"
                              return
                          }

                          if ($relationHost -notmatch $hostPattern) {
                              Write-Host "  ✗ URL does not match the expected environment URL shape: $($relation.url)"
                              return
                          }

                          Write-Host "  ✓ Matched: $($relation.url)"
                          $matchedCount++
                          $environmentsToDelete.Add([pscustomobject]@{
                                  workItemId = $workItemId
                                  url        = $relation.url
                                  linkIndex  = $workItem.relations.IndexOf($relation)
                              }) | Out-Null
                      }
                      
                      if ($hyperlinksWithComments.Count -gt 0) {
                          Write-Host "  Found $matchedCount matching environment(s) for deletion."
                      }
                  }
              }

              $environmentsToDelete = $environmentsToDelete | Sort-Object -Property workItemId, linkIndex -Descending

              if ($environmentsToDelete.Count -eq 0) {
                  Write-Host "No environments found to delete."
                  return
              }

              if (-not (Get-Module Microsoft.PowerApps.Administration.PowerShell -ListAvailable)) {
                  Install-Module Microsoft.PowerApps.Administration.PowerShell -Scope CurrentUser -Force
                  Write-Host "Microsoft.PowerApps.Administration.PowerShell installed"
              }

              Write-Host "Authenticating to management API as $env:DELETEENVIRONMENTS_MANAGEMENTAPP_APPLICATIONID."
              Add-PowerAppsAccount `
                  -TenantID $env:DELETEENVIRONMENTS_MANAGEMENTAPP_TENANTID `
                  -ApplicationId $env:DELETEENVIRONMENTS_MANAGEMENTAPP_APPLICATIONID `
                  -ClientSecret $env:DELETEENVIRONMENTS_MANAGEMENTAPP_CLIENTSECRET

              function Get-UrlHost {
                  param ($Url)

                  if ([string]::IsNullOrWhiteSpace($Url)) {
                      return $null
                  }

                  try {
                      return ([System.Uri]$Url).Host.ToLowerInvariant()
                  }
                  catch {
                      return $null
                  }
              }

              $connectionDataParameters = @{
                  Method          = "GET"
                  Headers         = $getProjectParameters.Headers
                  Uri             = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)_apis/connectionData"
                  UseBasicParsing = $true
              }
              $pipelineIdentityId = (Invoke-WebRequest @connectionDataParameters | Select-Object -ExpandProperty Content | ConvertFrom-Json).authenticatedUser.id
              if ([string]::IsNullOrWhiteSpace($pipelineIdentityId)) {
                  Write-Error "Unable to determine the identity of the pipeline."
                  return
              }

              # Hyperlink relations do not record who created them, so use the work item history. Azure DevOps sets
              # revisedBy on each update, so (unlike editable link metadata) it reliably identifies the link creator.
              function Get-PipelineCreatedHyperlinkUrls {
                  param ($WorkItemId)

                  $latestAddedBy = @{}
                  $skip = 0
                  $pageSize = 200
                  do {
                      $updatesUri = "$($apiBase)_apis/wit/workItems/$WorkItemId/updates?`$top=$pageSize&`$skip=$skip&api-version=7.0"
                      $updatesResponse = Invoke-WebRequest -Method GET -Headers $getProjectParameters.Headers -Uri $updatesUri -UseBasicParsing
                      $updates = @((ConvertFrom-Json -InputObject $updatesResponse.Content).value)
                      foreach ($update in $updates) {
                          foreach ($addedRelation in @($update.relations.added)) {
                              if ($addedRelation -and $addedRelation.rel -eq "Hyperlink" -and $addedRelation.url) {
                                  # Later updates overwrite earlier ones, so a re-added link uses its latest creator.
                                  $latestAddedBy[$addedRelation.url.ToLowerInvariant()] = $update.revisedBy.id
                              }
                          }
                      }
                      $skip += $pageSize
                  } while ($updates.Count -eq $pageSize)

                  $pipelineCreatedUrls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
                  foreach ($url in $latestAddedBy.Keys) {
                      if ($latestAddedBy[$url] -eq $pipelineIdentityId) {
                          $pipelineCreatedUrls.Add($url) | Out-Null
                      }
                  }

                  return , $pipelineCreatedUrls
              }

              # The stale-link clean-up trusts this list, so a failed listing must not look like "no environments".
              $allEnvironments = @(Get-AdminPowerAppEnvironment -ErrorAction Stop | Select-Object EnvironmentName, DisplayName, Internal)
              $allEnvironmentHosts = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              $allEnvironments | ForEach-Object {
                  $environmentHost = Get-UrlHost $_.Internal.properties.linkedEnvironmentMetadata.instanceUrl
                  if ($environmentHost) {
                      $allEnvironmentHosts.Add($environmentHost) | Out-Null
                  }
              }

              # Link metadata is editable, so only environments created by a trusted principal may be deleted.
              $createdBy = $env:DELETEENVIRONMENTS_SERVICEPRINCIPALOBJECTID
              Write-Host "Getting environments created by $createdBy."
              $environments = @($allEnvironments | Where-Object {
                  $_.Internal.properties.createdBy.id -eq $createdBy
              })

              # Do not return early when no owned environments remain: links for environments deleted by a previous
              # run whose relation PATCH failed may still need to be removed.
              Write-Host "Found $($environments.Count) owned environments ($($allEnvironments.Count) total)."

              # Group environments to delete by work item ID to batch operations
              $environmentsByWorkItem = $environmentsToDelete | Group-Object -Property workItemId

              $environmentsByWorkItem | ForEach-Object {
                  $workItemGroup = $_
                  $environmentsForWorkItem = @($workItemGroup.Group)
                  $workItemId = ([string]$environmentsForWorkItem[0].workItemId).Trim()
                  
                  if ([string]::IsNullOrWhiteSpace($workItemId)) {
                      Write-Warning "Skipping group with null/empty work item ID."
                      return
                  }
                  
                  Write-Host ""
                  Write-Host "Processing work item $workItemId ($($environmentsForWorkItem.Count) environment(s) to delete)..."

                  # Process all environments for this work item to delete all hyperlinks at once.
                  # Only remove work-item relations after the corresponding environment was verified as owned
                  # and successfully deleted, so a stale URL for another principal cannot be patched away.
                  $deletedEnvironmentLinks = [System.Collections.ArrayList]@()
                  $pipelineCreatedUrls = $null
                  foreach ($environmentToDelete in $environmentsForWorkItem) {
                      $linkHost = Get-UrlHost $environmentToDelete.url
                      if (-not $linkHost) {
                          continue
                      }

                      $matchingEnvironment = @($environments | Where-Object {
                          (Get-UrlHost $_.Internal.properties.linkedEnvironmentMetadata.instanceUrl) -eq $linkHost })

                      if ($matchingEnvironment.Count -eq 0) {
                          # Stale link clean-up: the environment no longer exists (e.g. a previous run deleted it but
                          # failed to remove the link). Only remove links created by this pipeline's identity whose
                          # host does not belong to any environment visible to the service principal.
                          if ($allEnvironmentHosts.Contains($linkHost)) {
                              Write-Host "  ✗ $($environmentToDelete.url) belongs to an environment not owned by this pipeline; leaving link."
                              continue
                          }

                          if ($null -eq $pipelineCreatedUrls) {
                              try {
                                  $pipelineCreatedUrls = Get-PipelineCreatedHyperlinkUrls -WorkItemId $workItemId
                              }
                              catch {
                                  Write-Warning "Failed to retrieve history for work item $workItemId; leaving stale links."
                                  Write-Warning $_
                                  $pipelineCreatedUrls = [System.Collections.Generic.HashSet[string]]::new()
                              }
                          }

                          if ($pipelineCreatedUrls.Contains($environmentToDelete.url)) {
                              Write-Host "  ✓ $($environmentToDelete.url) has no environment; removing stale link."
                              $deletedEnvironmentLinks.Add($environmentToDelete) | Out-Null
                          }
                          else {
                              Write-Host "  ✗ $($environmentToDelete.url) has no environment but was not created by this pipeline; leaving link."
                          }
                          continue
                      }

                      $matchingEnvironment = $matchingEnvironment[0]

                      Write-Host "Deleting $($matchingEnvironment.DisplayName)"
                      try {
                          $removeResult = Remove-AdminPowerAppEnvironment -EnvironmentName $matchingEnvironment.EnvironmentName -ErrorAction Stop
                          # The admin module can report API failures in its result object rather than as an error.
                          if ($removeResult -and ($removeResult.Error -or ($removeResult.Code -as [int]) -ge 400)) {
                              throw "Remove-AdminPowerAppEnvironment returned $($removeResult.Code): $($removeResult.Error | ConvertTo-Json -Compress -Depth 5)"
                          }
                          Write-Host "Deleted environment for $workItemId."
                          $deletedEnvironmentLinks.Add($environmentToDelete) | Out-Null
                      }
                      catch {
                          # Keep processing so links for environments already deleted in this group are still removed.
                          Write-Warning "Failed to delete $($matchingEnvironment.DisplayName)."
                          Write-Warning $_
                          continue
                      }
                  }

                  if ($deletedEnvironmentLinks.Count -eq 0) {
                      Write-Host "No owned or previously deleted environments found for work item $workItemId; skipping relation patch."
                      return
                  }
 
                  # Build a single PATCH document with only the relation removals that were verified and deleted.
                  # Sort indices in descending order to avoid index shifting issues.
                  $sortedIndices = @($deletedEnvironmentLinks | Sort-Object -Property linkIndex -Descending | ForEach-Object { $_.linkIndex })
                   
                  $patchDocument = @()
                   
                  # Add one history entry for all deletions
                  $historyValue = "<div>Deleted development environments:</div><div><br></div>"
                  $deletedEnvironmentLinks | ForEach-Object {
                      $historyValue += "<div><b>URL</b>: <a href=""$($_.url)"">$($_.url)</a></div>"
                  }
                   
                  $patchDocument += @{
                      op    = "add"
                      path  = "/fields/System.History"
                      value = $historyValue
                  }
                   
                  # Add all relation removals (in descending index order)
                  $sortedIndices | ForEach-Object {
                      $patchDocument += @{
                          op    = "remove"
                          path  = "/relations/$_"
                          value = $null
                      }
                  }

                  $patchUri = "$($apiBase)_apis/wit/workitems/$($workItemId)?api-version=7.0"
                  Write-Host "Submitting PATCH request for work item $workItemId ($($sortedIndices.Count) relation(s) to delete)..."
                  
                  $deleteRelationParameters = @{
                      Method          = "PATCH"
                      Headers         = @{
                          "Authorization" = $getProjectParameters.Headers.Authorization
                          "Content-Type"  = "application/json-patch+json"
                      }
                      Uri             = $patchUri
                      Body            = ConvertTo-Json -InputObject $patchDocument -Compress
                      UseBasicParsing = $true
                  }

                  $deleteRelationResponse = Invoke-WebRequest @deleteRelationParameters
                  if ($deleteRelationResponse.StatusCode -ne [System.Net.HttpStatusCode]::OK) {
                      Write-Warning "Failed to delete work item hyperlinks for work item $workItemId."
                      Write-Warning $deleteRelationResponse.StatusDescription
                      return
                  }
                  Write-Host "✓ Deleted $($sortedIndices.Count) work item hyperlink(s) for work item $workItemId."
              }
              Write-Host "Finished processing work items."
            displayName: Delete work item environments
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              DELETEENVIRONMENTS_MANAGEMENTAPP_TENANTID: $(SetConnectionVariables.BuildTools.TenantId)
              DELETEENVIRONMENTS_MANAGEMENTAPP_APPLICATIONID: $(SetConnectionVariables.BuildTools.ApplicationId)
              DELETEENVIRONMENTS_MANAGEMENTAPP_CLIENTSECRET: $(SetConnectionVariables.BuildTools.ClientSecret)
              DELETEENVIRONMENTS_SERVICEPRINCIPALOBJECTID: $(DeleteServicePrincipalObjectId)
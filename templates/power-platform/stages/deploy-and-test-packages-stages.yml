parameters:
  - name: serviceConnection
    displayName: Service connection
    type: string
  - name: environment
    displayName: Environment
    type: string
  - name: packages
    displayName: Packages
    type: object
  - name: url
    displayName: URL (optional override)
    type: string
    default: ''
  - name: tagSuccess
    displayName: Tag resources on successful deployment
    type: boolean
    default: false
  - name: postDeploymentJobs
    displayName: Optional post-deployment jobs
    type: jobList
    default: []
  - name: testJobs
    displayName: Optional test jobs
    type: jobList
    default: []
  - name: deployStageName
    displayName: Deploy stage name
    type: string
    default: DeployPackages
  - name: testStageName
    displayName: Test stage name
    type: string
    default: Test
  - name: testStageDisplayName
    displayName: Test stage display name
    type: string
    default: Test
  - name: dependsOn
    displayName: Deploy stage depends on
    type: object
    default: []
  - name: variables
    displayName: Variables (list of name/value pairs or groups) for the deploy and test stages
    type: object
    default: []

stages:
  - template: deploy-packages-stage.yml
    parameters:
      stageName: ${{ parameters.deployStageName }}
      variables: ${{ parameters.variables }}
      serviceConnection: ${{ parameters.serviceConnection }}
      environment: ${{ parameters.environment }}
      packages: ${{ parameters.packages }}
      url: ${{ parameters.url }}
      tagSuccess: ${{ parameters.tagSuccess }}
      postDeploymentJobs: ${{ parameters.postDeploymentJobs }}
      dependsOn: ${{ parameters.dependsOn }}
  - ${{ if gt(length(parameters.testJobs), 0) }}:
    - stage: ${{ parameters.testStageName }}
      displayName: ${{ parameters.testStageDisplayName }}
      dependsOn:
        - ${{ parameters.deployStageName }}
      ${{ if or(parameters.url, gt(length(parameters.variables), 0)) }}:
        variables:
          - ${{ if parameters.url }}:
            - name: BuildTools.EnvironmentUrl
              value: ${{ parameters.url }}
          - ${{ each variable in parameters.variables }}:
            - ${{ variable }}
      ${{ if parameters.url }}:
        jobs: ${{ parameters.testJobs }}
      ${{ if eq(parameters.url, '') }}:
        jobs:
          - ${{ each job in parameters.testJobs }}:
            - ${{ each pair in job }}:
                ${{ if not(in(pair.key, 'steps', 'variables')) }}:
                  ${{ pair.key }}: ${{ pair.value }}
              variables:
                - name: BuildTools.EnvironmentUrl
                  value: ${{ parameters.url }}
                - ${{ job.variables }}
              steps:
                - task: PowerPlatformToolInstaller@2
                  displayName: Install Power Platform Build Tools
                - task: PowerPlatformSetConnectionVariables@2
                  name: PowerPlatformSetConnectionVariables
                  displayName: Set service connection variables
                  inputs:
                    authenticationType: PowerPlatformSPN
                    PowerPlatformSPN: ${{ parameters.serviceConnection }}
                - ${{ job.steps }}
